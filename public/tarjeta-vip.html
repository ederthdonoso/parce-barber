<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Tarjeta VIP | Parce Barber</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .scratch-container {
            position: relative;
            width: 340px;
            height: 200px;
            margin: 30px auto;
            user-select: none;
            box-shadow: 0 10px 30px rgba(211, 0, 0, 0.2);
            border-radius: 12px;
        }
        .scratch-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #111, #222);
            border: 2px solid #ffb700;
            border-radius: 12px;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            text-align: center; color: white;
        }
        #scratch-canvas {
            position: absolute;
            top: 0; left: 0;
            cursor: crosshair;
            border-radius: 12px;
            z-index: 10;
        }
        .nombre-vip {
            font-size: 2rem;
            color: var(--white);
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>
<body style="text-align:center; padding:50px 20px;">

    <h1 style="color:#ffb700; font-size: 2.5rem; text-shadow: 0 0 15px rgba(255, 183, 0, 0.3);">★ TARJETA VIP ★</h1>
    <h2 class="nombre-vip">¡Felicidades, <span class="red" id="nombre-cliente">CLIENTE</span>!</h2>
    <p style="color:var(--grey-text); margin-top:15px; font-size: 1.1rem;">Has completado tus 30 cortes con el Jefe Parce.<br>¡Raspa la tarjeta para revelar tu premio!</p>

    <div class="scratch-container">
        <!-- El Premio Oculto Atrás -->
        <div class="scratch-bg">
            <h2 style="color:#ffb700; font-size:2.2rem; letter-spacing:1px; text-shadow: 0 0 10px rgba(255, 183, 0, 0.5);">¡CORTE GRATIS!</h2>
            <p style="font-size:0.9rem; color:#ccc; margin-top:10px;">⚠️ <strong>Muestra este ticket al Jefe</strong> en la barbería<br>para validar tu corte gratis.</p>
            <span style="font-size:0.8rem; margin-top:15px; border:1px dashed #ffb700; padding:5px 10px; background: rgba(255, 183, 0, 0.1);">CÓDIGO: <span id="codigo-vip">VIP-FREE</span></span>
        </div>
        <!-- Capa Gris/Roja para Raspar arriba -->
        <canvas id="scratch-canvas" width="340" height="200"></canvas>
    </div>

    <button class="btn-urban" style="margin-top: 20px;" onclick="location.href='index.html'">Volver al Inicio</button>

    <script>
        // Obtener el nombre del cliente desde la URL
        const urlParams = new URLSearchParams(window.location.search);
        const nombreVip = urlParams.get('nombre') || "CLIENTE VIP";
        document.getElementById('nombre-cliente').innerText = nombreVip.toUpperCase();
        // Generar un código único visual
        document.getElementById('codigo-vip').innerText = `VIP-${nombreVip.substring(0,4).toUpperCase()}-FREE`;

        const canvas = document.getElementById('scratch-canvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;

        ctx.fillStyle = '#1a0000'; 
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.strokeStyle = '#d30000';
        ctx.lineWidth = 5;
        for (let i = -100; i < canvas.width + 100; i += 30) {
            ctx.beginPath();
            ctx.moveTo(i, 0);
            ctx.lineTo(i + 150, canvas.height);
            ctx.stroke();
        }

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 20px Montserrat';
        ctx.textAlign = 'center';
        ctx.shadowColor = "black";
        ctx.shadowBlur = 5;
        ctx.fillText('RASPA AQUÍ', canvas.width / 2, canvas.height / 2 + 10);

        function scratch(e) {
            if (!isDrawing) return;
            e.preventDefault(); 
            const rect = canvas.getBoundingClientRect();
            let x, y;
            if (e.type.includes('mouse')) {
                x = e.clientX - rect.left;
                y = e.clientY - rect.top;
            } else if (e.type.includes('touch')) {
                x = e.touches[0].clientX - rect.left;
                y = e.touches[0].clientY - rect.top;
            }
            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.arc(x, y, 25, 0, Math.PI * 2); 
            ctx.fill();
        }

        canvas.addEventListener('mousedown', () => isDrawing = true);
        canvas.addEventListener('mouseup', () => isDrawing = false);
        canvas.addEventListener('mousemove', scratch);
        canvas.addEventListener('mouseleave', () => isDrawing = false);
        canvas.addEventListener('touchstart', (e) => { isDrawing = true; scratch(e); }, { passive: false });
        canvas.addEventListener('touchend', () => isDrawing = false);
        canvas.addEventListener('touchmove', scratch, { passive: false });
    </script>
</body>
</html>
